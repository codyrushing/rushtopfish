# ======================= REUSABLE SHARED DEFINITIONS ======================
_shared:
  banner_fields: &banner_fields
    - name: hidden
      label: Hidden
      widget: boolean
      required: false
    - name: extra_classes
      label: extra_classes
      widget: string
      required: false
    - name: content
      label: Content
      widget: markdown
      required: false
  bg_media_fields: &bg_media_fields
    - name: media
      label: Media
      widget: image

    - name: fit
      label: Fit
      widget: select
      required: false
      options: [contain, cover, fill, none]

    - name: x_pos
      label: Horizontal position
      widget: number
      default: 50
      value_type: "int"
      hint: 0 is left, 50 is center, 100 is right
      step: 1
      required: false

    - name: y_pos
      label: Vertical position
      widget: number
      default: 50
      value_type: "int"
      hint: 0 is top, 50 is center, 100 is bottom
      step: 1
      required: false

    - name: alt
      label: Alt
      required: false
      hint: Short description of image
      widget: string

    - name: caption
      label: Caption
      required: false
      hint: eg. photo credit
      widget: markdown
  page_section_fields: &page_section_fields
    - name: title
      label: Name
      widget: string

    - name: heading
      label: Heading text
      widget: string
      required: false

    - name: linkable
      label: Linkable?
      widget: boolean
      required: false

    - name: size
      label: Size
      widget: select
      required: false
      default: [auto]
      options: [auto, full_screen]

    - name: content_blocks
      label: Content blocks
      widget: list
      required: false
      types:
        - label: Rich text
          name: rich_text
          widget: object
          fields:
            - label: Rich text content
              name: content
              widget: markdown
            - label: Content style
              name: content_style
              widget: select
              options: ["light", "dark"]
              required: false
            - label: Content background
              name: content_background
              widget: boolean
              required: false
            - label: Extra classes
              name: extra_classes
              widget: string
              required: false

        - label: Aside content
          name: aside
          hint: Add an image along side some content
          widget: object
          fields:
            - name: image
              label: Image
              widget: image
              required: false

            - name: alt
              label: Image Alt
              widget: string
              required: false

            - name: caption
              label: Caption
              widget: markdown
              required: false

            - name: image_extra_classes
              label: Image extra classes
              widget: string
              required: false

            - name: content
              label: Content
              widget: markdown
              required: false

            - name: content_extra_classes
              label: Content extra classes
              widget: string
              required: false

            - name: image_aspect_ratio
              label: Image aspect ratio
              widget: select
              options:
                - label: "None"
                  value: "aspect-auto"
                - label: "1x1"
                  value: "aspect-square"
                - label: "3x2"
                  value: "aspect-3/2"
              required: false

            - name: x_pos
              label: Horizontal position
              widget: number
              default: 50
              value_type: "int"
              hint: 0 is left, 50 is center, 100 is right
              step: 1
              required: false

            - name: y_pos
              label: Vertical position
              widget: number
              default: 50
              value_type: "int"
              hint: 0 is top, 50 is center, 100 is bottom
              step: 1
              required: false

        - label: Newsletter signup
          name: newsletter_signup
          widget: object
          fields:
            - label: Show newsletter signup form
              name: show_signup_form
              widget: boolean
              required: false

    - name: content_style
      label: Content style
      widget: select
      options: [light, dark]
      required: false

    - name: content_background
      label: Content background
      widget: boolean
      required: false

    - name: x_pos
      label: Content horizontal position
      widget: select
      options: [left, center, right]
      required: false

    - name: y_pos
      label: Content vertical position
      widget: select
      options: [top, center, bottom]
      required: false

    - name: extra_classes
      label: Extra classes
      widget: string
      required: false

    - name: background_color
      label: Background color
      required: false
      widget: color

    - name: images
      label: Media
      widget: list
      required: false
      fields: *bg_media_fields
  page_fields: &page_fields
    - name: title
      label: Title
      widget: string

    - name: slug
      label: Slug
      widget: string
      hint: Page slug - use "index" for home page

    - name: description
      label: Description
      widget: text

    - name: banner
      label: Banner
      widget: object
      required: false
      fields: *banner_fields

    - name: sections
      label: Page sections
      widget: list
      slug: "{{fields.name}}"
      summary: "{{fields.title}}"
      required: false
      fields: *page_section_fields

# ======================= BEGIN CONFIGURATION ======================

media_folder: packages/web/src/assets/images # Location where files will be stored in the repo
public_folder: /src/assets/images # The src attribute for uploaded media
backend:
  name: github
  repo: codyrushing/rushtopfish
  branch: main

collections:
  - name: landing-page
    label: Landing page
    icon: home
    files:
      - name: landing
        label: Landing
        file: packages/web/src/content/pages/landing.yml
        fields:
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Dance media
            name: dance_media
            widget: object
            fields: *bg_media_fields
          - label: Pilates media
            name: pilates_media
            widget: object
            fields: *bg_media_fields

  - name: pages_dance
    label: Dance pages
    icon: news
    slug: "{{fields.slug}}"
    create: true # Allow users to create new documents in this collection
    files:
      - name: home
        label: Home
        file: packages/web/src/content/pages/dance/home.yml
        fields: *page_fields

  - name: banners_dance
    label: Dance banners
    icon: campaign
    create: true # Allow users to create new documents in this collection
    folder: packages/web/src/content/banners/dance
    fields: *banner_fields

  - name: pages_pilates
    label: Pilates pages
    icon: news
    slug: "{{fields.slug}}"
    create: true # Allow users to create new documents in this collection
    files:
      - name: home
        label: Home
        file: packages/web/src/content/pages/pilates/home.yml
        fields: *page_fields

  - name: banners_pilates
    label: Pilates banners
    icon: campaign
    create: true # Allow users to create new documents in this collection
    folder: packages/web/src/content/banners/pilates
    fields: *banner_fields
